<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>交易物种 · 时光机</title>
<style>
:root{--gold:#ff7a1a;--gold-hi:#1b1f3b;--gold-dim:#4a4f6e;--line:#1b1f3b;--line-hi:#1b1f3b;--cyan:#3d7bff;--violet:#8b5cf6;--ink-dim:#4a4f6e;--ink-faint:#8b90a8}

:root{color-scheme:light;--bg:#fff7e8;--paper:#ffffff;--ink:#1b1f3b;--ink-2:#4a4f6e;--ink-3:#8b90a8;--yellow:#ffd23f;--orange:#ff7a1a;--pink:#ff5c8a;--mint:#2fd3a0;--blue:#3d7bff;--purple:#8b5cf6;--up:#ff4d6d;--down:#12b886;--bw:2.5px;--sh:6px 6px 0 var(--ink);--sh-m:4px 4px 0 var(--ink);--sh-s:3px 3px 0 var(--ink);--ff:"PingFang SC","HarmonyOS Sans SC","MiSans","Microsoft YaHei","Noto Sans SC",system-ui,-apple-system,"Segoe UI",sans-serif;--ff-num:"Avenir Next","DIN Alternate","Helvetica Neue",Arial,var(--ff);--bounce:cubic-bezier(.34,1.56,.64,1)}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;overflow-x:hidden;color:var(--ink);font:500 15px/1.6 var(--ff);background-color:var(--bg);background-image:radial-gradient(rgba(27,31,59,.09) 1.3px,transparent 1.5px);background-size:22px 22px}
#sky,#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#sky{z-index:0}
#fx{z-index:60}
.lattice{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(440px 440px at 6% 10%,rgba(255,210,63,.38),transparent 62%),radial-gradient(520px 520px at 98% 6%,rgba(92,200,255,.30),transparent 62%),radial-gradient(560px 560px at 92% 98%,rgba(255,92,138,.22),transparent 62%),radial-gradient(420px 420px at 2% 96%,rgba(47,211,160,.22),transparent 62%)}
.vignette{display:none}
#app{position:relative;z-index:2;max-width:1080px;margin:0 auto;padding:18px 16px 56px}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
.muted{color:var(--ink-2)}
.small{font-size:13px}
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.85) rotate(-2deg);opacity:0}60%{transform:scale(1.03) rotate(.6deg);opacity:1}100%{transform:none;opacity:1}}
@keyframes shimmer{from{background-position:160% 0}to{background-position:-90% 0}}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-10px) rotate(-2deg)}}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes slam{0%{transform:scale(2.8) rotate(-18deg);opacity:0}55%{transform:scale(.88) rotate(-4deg);opacity:1}78%{transform:scale(1.08) rotate(-7deg)}100%{transform:scale(1) rotate(-6deg);opacity:1}}
@keyframes shake{0%,100%{transform:none}15%{transform:translateX(-9px) rotate(-.6deg)}35%{transform:translateX(8px) rotate(.5deg)}55%{transform:translateX(-5px)}75%{transform:translateX(4px)}}
@keyframes bubin{from{opacity:0;transform:translateX(-18px) scale(.6)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scale(0) rotate(-20deg);opacity:0}to{transform:none;opacity:1}}
@keyframes flick{0%,100%{opacity:.95}50%{opacity:.35}}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-10deg) scale(1.1)}75%{transform:rotate(10deg) scale(1.1)}}
@keyframes jelly{0%{transform:scale(1)}30%{transform:scale(1.25,.78)}45%{transform:scale(.84,1.2)}60%{transform:scale(1.1,.92)}78%{transform:scale(.97,1.04)}100%{transform:scale(1)}}
@keyframes hop{0%,55%,100%{transform:translateY(0) rotate(0)}25%{transform:translateY(-18px) rotate(-6deg)}42%{transform:translateY(0) scale(1.1,.88)}}
@keyframes drop{0%{transform:translateY(-70px) rotate(-14deg);opacity:0}60%{transform:translateY(8px) rotate(3deg);opacity:1}100%{transform:none;opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes stripes{to{background-position:20px 0}}
@keyframes bob{0%,100%{transform:scale(1.25) translateY(0)}50%{transform:scale(1.25) translateY(-4px)}}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes ring{0%{box-shadow:var(--sh-s),0 0 0 0 rgba(255,122,26,.55)}100%{box-shadow:var(--sh-s),0 0 0 16px rgba(255,122,26,0)}}
.screen{animation:rise .5s var(--bounce) both}
.jelly{animation:jelly .6s var(--bounce)!important}
.eyebrow{margin:0;font:800 11px/1.5 var(--ff-num);letter-spacing:.24em;color:var(--purple);text-transform:uppercase}
.brandbar{display:flex;align-items:center;justify-content:space-between;padding:6px 2px 14px}
.brand{display:flex;align-items:center;gap:10px;font:800 16px var(--ff);letter-spacing:.04em;color:var(--ink)}
.brand i{position:relative;width:24px;height:24px;border-radius:8px;border:var(--bw) solid var(--ink);background:var(--yellow);box-shadow:2px 2px 0 var(--ink);animation:wiggle 3s ease-in-out infinite}
.brand i::after{content:"";position:absolute;inset:5px;border-radius:50%;background:var(--pink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 26px;border:var(--bw) solid var(--ink);border-radius:14px;background:var(--paper);color:var(--ink);font-weight:800;letter-spacing:.06em;box-shadow:var(--sh-s);transition:transform .16s var(--bounce),box-shadow .16s}
.btn:hover:not(:disabled){transform:translate(-2px,-2px);box-shadow:5px 5px 0 var(--ink)}
.btn:active:not(:disabled){transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn:disabled{opacity:.42;cursor:not-allowed;box-shadow:none}
.btn.primary{background:var(--yellow)}
.confirm .btn.primary:not(:disabled),.nextrow .btn.primary{animation:ring 1.4s ease-out infinite}
.btn.big{min-height:54px;padding:12px 34px;font-size:17px}
.btn.ghost{min-height:38px;padding:6px 16px;font-size:13px;letter-spacing:.04em}
.frame{position:relative;background:var(--paper);border:var(--bw) solid var(--ink);border-radius:20px;box-shadow:var(--sh)}
.frame::before{content:none}
.orn{display:flex;align-items:center;justify-content:center;gap:12px;margin:16px 0 0}
.orn::before,.orn::after{content:"";width:min(18vw,120px);height:4px;border-radius:2px;background:var(--ink)}
.orn b{width:12px;height:12px;border-radius:50%;background:var(--pink);border:2px solid var(--ink);box-shadow:18px 0 0 -2px var(--yellow),36px 0 0 -2px var(--blue);margin-right:36px}
.hero{text-align:center;padding:22px 0 10px}
.hero h1{margin:8px 0 4px;font:900 clamp(52px,12vw,104px)/1.05 var(--ff);letter-spacing:.04em;color:var(--ink)}
.hero h1 span{display:inline-block;color:var(--c,var(--yellow));-webkit-text-stroke:3px var(--ink);text-shadow:5px 5px 0 var(--ink);animation:drop .8s var(--bounce) both;cursor:pointer}
.hero h1 span:nth-child(1){--c:var(--yellow);animation-delay:.05s}
.hero h1 span:nth-child(2){--c:var(--pink);animation-delay:.15s}
.hero h1 span:nth-child(3){--c:var(--mint);animation-delay:.25s}
.hero h1 span:nth-child(4){--c:#5cc8ff;animation-delay:.35s}
.hero .sub{display:inline-block;margin:6px 0 0;padding:6px 18px;font:800 17px var(--ff);letter-spacing:.08em;color:var(--ink);background:var(--paper);border:var(--bw) solid var(--ink);border-radius:999px;box-shadow:var(--sh-s);transform:rotate(-1.5deg)}
.mascots{display:flex;justify-content:center;align-items:flex-end;gap:clamp(10px,3vw,26px);margin:16px 0 10px}
.mascots i{display:block;font-size:62px;line-height:0;animation:hop 2.6s var(--bounce) infinite;cursor:pointer}
.mascots i:nth-child(2){animation-delay:.18s}
.mascots i:nth-child(3){animation-delay:.36s}
.mascots i:nth-child(4){animation-delay:.54s}
.mascot .eye{transform-box:fill-box;transform-origin:center;animation:blink 4.6s infinite}
.worlds{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:16px}
.world{display:flex;flex-direction:column;align-items:flex-start;gap:14px;padding:24px;transition:transform .2s var(--bounce),box-shadow .2s}
.world:hover{transform:translate(-3px,-3px) rotate(-.6deg);box-shadow:9px 9px 0 var(--ink)}
.worlds .world:nth-child(1){background:#fff0b8}
.worlds .world:nth-child(2){background:#dff3ff}
.world .no{display:inline-block;padding:3px 12px;border-radius:999px;background:var(--ink);color:#fff;font:800 12px var(--ff);letter-spacing:.12em}
.world h3{margin:0;font:900 28px/1.25 var(--ff);color:var(--ink)}
.world .btn{margin-top:auto}
.props{display:flex;flex-wrap:wrap;gap:10px 12px}
.pp{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 10px 6px;background:var(--paper);border:2px solid var(--ink);border-radius:14px;box-shadow:var(--sh-s);animation:floaty 3s ease-in-out infinite;cursor:pointer}
.pp i{display:block;font-style:normal;font-size:34px;line-height:1.1;transition:transform .25s var(--bounce)}
.pp:hover i{transform:scale(1.25) rotate(-8deg)}
.pp em{font:800 11px var(--ff-num);font-style:normal;color:var(--ink-2)}
.mini{width:100%;padding:10px;border:2px solid var(--ink);border-radius:14px;background:var(--paper)}
.mini svg{display:block;width:100%;height:auto}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tag{padding:3px 12px;border:2px solid var(--ink);border-radius:999px;background:var(--paper);color:var(--ink);font:700 12px var(--ff)}
.tag:nth-child(3n+1){background:#ffe7a3}
.tag:nth-child(3n+2){background:#c8f5e6}
.tag:nth-child(3n){background:#ffd6e2}
.rules{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin:24px 0 0;padding:0;list-style:none}
.rules li{display:flex;align-items:center;gap:8px;padding:8px 18px;border:var(--bw) solid var(--ink);border-radius:999px;background:var(--paper);box-shadow:var(--sh-s);font:800 14px var(--ff);color:var(--ink);transition:transform .2s var(--bounce)}
.rules li:hover{transform:translateY(-3px) rotate(-2deg)}
.rules span{font-size:18px}
.hud{display:flex;gap:12px;margin-bottom:16px}
.route{flex:1;position:relative;display:flex;justify-content:space-between;align-items:center;padding:14px 24px 10px;min-width:0}
.route .rail{position:absolute;left:41px;right:41px;top:24px;height:8px;border-radius:4px;background:#efe8d8;border:2px solid var(--ink)}
.route .rail i{position:absolute;left:0;top:0;height:100%;border-radius:3px;background-image:linear-gradient(45deg,var(--orange) 25%,var(--yellow) 25%,var(--yellow) 50%,var(--orange) 50%,var(--orange) 75%,var(--yellow) 75%,var(--yellow));background-size:20px 20px;animation:stripes .8s linear infinite;transition:width .8s var(--bounce)}
.node{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:34px}
.node i{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;border:var(--bw) solid var(--ink);background:var(--paper);font:900 12px/1 var(--ff);font-style:normal;color:#fff;transition:.3s var(--bounce)}
.node em{font:800 12px var(--ff-num);font-style:normal;color:var(--ink-3)}
.node.done i{background:var(--mint)}
.node.done i::after{content:"✓"}
.node.now i{background:var(--yellow);animation:bob 1s ease-in-out infinite}
.node.done em,.node.now em{color:var(--ink)}
.bagc{flex:0 0 auto;min-width:220px;padding:10px 18px;display:flex;flex-direction:column;justify-content:center;text-align:right;background:#c8f5e6}
.bagc .lab{font:800 11px var(--ff);letter-spacing:.2em;color:var(--ink-2)}
.bagc .val{font:900 24px/1.25 var(--ff-num);color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.ev{overflow:hidden}
.stage3{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(0,1fr)}
.art{position:relative;min-height:470px;overflow:hidden;border-right:var(--bw) solid var(--ink);background:linear-gradient(180deg,var(--sky1,#bfe6ff),var(--sky2,#eef8ff))}
.art .layer{position:absolute;inset:0;pointer-events:none;transition:transform .25s ease-out}
.art .l-sky{transform:translate(calc(var(--mx,0)*6px),calc(var(--my,0)*3px))}
.art .l-prop{transform:translate(calc(var(--mx,0)*-14px),calc(var(--my,0)*-9px))}
.art svg.sky{position:absolute;left:-12px;bottom:0;width:calc(100% + 24px);height:42%}
.art .win{animation:flick 3s infinite}
.art .place{position:absolute;left:16px;top:16px;z-index:3;display:flex;align-items:center;gap:8px;padding:4px 14px;border-radius:999px;background:var(--ink);color:#fff;font:800 13px var(--ff);letter-spacing:.06em}
.art .place::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--yellow)}
.art .year{position:absolute;right:16px;top:10px;z-index:3;font:900 clamp(56px,8vw,82px)/1 var(--ff-num);color:#fff;-webkit-text-stroke:3px var(--ink);text-shadow:5px 5px 0 var(--ink);letter-spacing:-.01em}
/* iOS WebKit（Safari 及 iOS 上所有浏览器）对「描边＋硬投影」文字会渲染成重影/空心，改用多重投影模拟描边；桌面 Blink 内核无此问题，不受影响 */
@supports (-webkit-touch-callout:none){
  .hero h1 span,.art .year{-webkit-text-stroke-width:0;text-shadow:3px 0 0 var(--ink),-3px 0 0 var(--ink),0 3px 0 var(--ink),0 -3px 0 var(--ink),2.2px 2.2px 0 var(--ink),-2.2px 2.2px 0 var(--ink),2.2px -2.2px 0 var(--ink),-2.2px -2.2px 0 var(--ink),5px 5px 0 var(--ink)}
}
.propbox{position:absolute;right:7%;top:25%;display:flex;flex-direction:column;align-items:center;gap:12px}
.art .prop{font-size:clamp(84px,11vw,118px);line-height:1;filter:drop-shadow(5px 6px 0 rgba(27,31,59,.85));animation:floaty 3.6s ease-in-out infinite;pointer-events:auto;cursor:pointer}
.art .stat{display:flex;align-items:baseline;gap:8px;padding:6px 16px;background:var(--paper);border:var(--bw) solid var(--ink);border-radius:12px;box-shadow:var(--sh-s);transform:rotate(-2deg)}
.art .stat b{font:900 24px var(--ff-num);color:var(--ink)}
.art .stat span{font:700 12px var(--ff);color:var(--ink-2)}
.bubbles{position:absolute;left:16px;top:62px;z-index:3;display:flex;flex-direction:column;gap:10px;max-width:58%}
.bub{display:flex;align-items:center;gap:10px;padding:7px 16px 7px 7px;background:var(--paper);border:var(--bw) solid var(--ink);border-radius:22px 22px 22px 6px;box-shadow:var(--sh-s);animation:bubin .5s var(--bounce) both}
.bub:nth-child(2){background:#fff0b8;margin-left:22px}
.bub .av{flex:none;display:grid;place-items:center;width:34px;height:34px;font-size:20px;border-radius:50%;background:#ffe1ea;border:2px solid var(--ink)}
.bub .bt{font:800 15px/1.35 var(--ff);color:var(--ink)}
.gauge{position:absolute;left:14px;bottom:12px;z-index:3;width:178px;padding:6px 8px 4px;text-align:center;background:var(--paper);border:var(--bw) solid var(--ink);border-radius:16px;box-shadow:var(--sh-s)}
.gauge svg{display:block;width:100%;height:auto}
.gauge text{font:700 11px var(--ff);fill:var(--ink-2)}
.gauge .nd{transform-origin:100px 100px;transition:transform 1.6s cubic-bezier(.3,1.7,.5,1)}
.gauge small{display:block;margin-top:-4px;font:800 11px var(--ff);letter-spacing:.16em;color:var(--ink-2)}
.side{position:relative;padding:26px 26px 24px;display:flex;flex-direction:column;min-height:470px;background:var(--paper)}
.ask{margin:4px 0 16px;font:900 28px/1.25 var(--ff);color:var(--ink)}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.card{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:120px;padding:18px 8px 12px;text-align:center;border:var(--bw) solid var(--ink);border-radius:16px;background:var(--cbg,#fff);box-shadow:var(--sh-m);color:var(--ink);transition:transform .18s var(--bounce),box-shadow .18s,opacity .25s}
.card:nth-child(1){--cbg:#fff0b8}
.card:nth-child(2){--cbg:#dff3ff}
.card:nth-child(3){--cbg:#ffe1ea}
.card:nth-child(4){--cbg:#d9f7ec}
.card .ic{font-size:40px;line-height:1;transition:transform .25s var(--bounce)}
.card .lb{font:800 15px/1.3 var(--ff)}
.card .kk{position:absolute;left:8px;top:7px;display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--ink);color:#fff;font:800 11px/1 var(--ff)}
.card:hover:not(:disabled){transform:translate(-3px,-3px);box-shadow:7px 7px 0 var(--ink)}
.card:hover:not(:disabled) .ic{transform:scale(1.18) rotate(-8deg)}
.card:active:not(:disabled){transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.card[aria-pressed="true"]{background:var(--yellow);transform:translate(-3px,-3px) rotate(-1.5deg);box-shadow:7px 7px 0 var(--ink)}
.card[aria-pressed="true"] .ic{animation:wiggle .6s ease-in-out infinite}
.card[aria-pressed="true"]::after{content:"✓";position:absolute;right:-10px;top:-10px;display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--mint);border:var(--bw) solid var(--ink);color:#fff;font:900 15px/1 var(--ff);animation:grow .3s var(--bounce) both}
.confirm{margin-top:auto;padding-top:20px;display:flex;justify-content:flex-end}
.coin{position:fixed;z-index:70;left:0;top:0;font-size:24px;pointer-events:none}
.rv{display:flex;flex-direction:column;gap:12px;flex:1;animation:rise .4s var(--bounce) both}
.picked{display:flex;align-items:center;gap:10px;font:700 14px var(--ff);color:var(--ink-2)}
.picked .ic{font-size:30px}
.picked b{padding:2px 10px;border-radius:8px;background:var(--yellow);color:var(--ink);font-weight:900}
.ticker{display:flex;align-items:center;justify-content:space-between;gap:10px}
.ticker .ends{padding:3px 12px;border-radius:999px;background:var(--purple);color:#fff;font:800 12px var(--ff);letter-spacing:.1em}
.ticker .ends:empty{display:none}
.ticker .yc{font:900 48px/1 var(--ff-num);color:var(--ink);font-variant-numeric:tabular-nums;text-shadow:3px 3px 0 var(--yellow)}
.spark{position:relative;height:118px;border:var(--bw) solid var(--ink);border-radius:14px;overflow:hidden;background-color:#fbf8f1;background-image:radial-gradient(rgba(27,31,59,.12) 1px,transparent 1.2px);background-size:14px 14px}
.spark svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.spark small{position:absolute;right:8px;bottom:4px;font:700 10px var(--ff);color:var(--ink-3)}
.numrow{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;min-height:76px}
.num{font:900 clamp(34px,5vw,48px)/1 var(--ff-num);color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.num small{display:block;margin-bottom:6px;font:700 12px var(--ff);letter-spacing:.1em;color:var(--ink-2)}
.numr{display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.mult{font:900 24px var(--ff-num);color:var(--blue);min-height:28px}
.stamp3{display:inline-block;padding:6px 16px;border:3px solid var(--ink);border-radius:12px;font:900 22px var(--ff);letter-spacing:.14em;color:var(--ink);box-shadow:var(--sh-m);transform:rotate(-6deg);opacity:0}
.stamp3.slam{animation:slam .55s cubic-bezier(.2,.9,.3,1) both}
.stamp3.hi{background:var(--yellow)}
.stamp3.mid{background:#bfe6ff}
.stamp3.lo{background:#eceff5;color:var(--ink-2)}
.stamp3.bad{background:var(--up);color:#fff}
.rline{margin:0;font:800 17px/1.5 var(--ff);color:var(--ink);min-height:26px}
.fold{align-self:flex-start;padding:4px 0;border:0;background:none;color:var(--blue);font:800 13px var(--ff);text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px}
.truth{margin:0;padding:10px 14px;font:500 13px/1.65 var(--ff);color:var(--ink-2);border:2px dashed var(--ink-3);border-radius:12px;background:#fbf8f1}
.nextrow{margin-top:auto;display:flex;justify-content:flex-end}
.shake{animation:shake .5s}
.facts3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:18px 20px 4px}
.fact{display:flex;align-items:center;gap:10px;padding:10px 12px;border:var(--bw) solid var(--ink);border-radius:14px;background:var(--fbg,#fff);box-shadow:var(--sh-s)}
.fact:nth-child(1){--fbg:#fff0b8}
.fact:nth-child(2){--fbg:#dff3ff}
.fact:nth-child(3){--fbg:#ffe1ea}
.fact i{font-style:normal;font-size:24px}
.fact b{display:block;font:900 21px/1.2 var(--ff-num);font-variant-numeric:tabular-nums}
.fact small{font:700 11px var(--ff);letter-spacing:.1em;color:var(--ink-2)}
.up{color:var(--up)}
.dn{color:var(--down)}
.chartbox{padding:10px 20px 4px}
.chartbox svg{display:block;width:100%;height:auto}
